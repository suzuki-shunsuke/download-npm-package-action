name: Download npm packages
description: Install npm packages through Takumi Guard and upload node_modules as an artifact
author: Shunsuke Suzuki
inputs:
  takumi_guard_bot_id:
    description: Takumi Guard Bot id
    required: false
  working_directory:
    description: The directory where package.json and package-lock.json exist
    required: false
    default: "."
  node-version-file:
    description: Node.js version file path
    required: false
    default: .node-version
  artifact_name:
    description: |
      GitHub artifact name.
      Artifact names must be unique in a workflow run.
    required: false
    default: node_modules
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{inputs.node-version-file}}

    - name: Set up Takumi Guard
      uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      with:
        bot-id: ${{inputs.takumi_guard_bot_id}}

    # Don't run install scripts of npm packages in this job because it has id-token: write.
    # The restore action runs them by npm rebuild in the job restoring node_modules.
    - name: Install npm packages
      shell: bash
      working-directory: ${{inputs.working_directory}}
      run: npm ci --ignore-scripts

    # Archive node_modules with tar to keep file permissions and symlinks (e.g. node_modules/.bin)
    - name: Archive node_modules
      shell: bash
      working-directory: ${{inputs.working_directory}}
      env:
        ARTIFACT_NAME: ${{inputs.artifact_name}}
      run: |
        dir=$RUNNER_TEMP/download-npm-package-action/$ARTIFACT_NAME
        mkdir -p "$dir"
        tar -cf "$dir/node_modules.tar" node_modules

    - name: Upload node_modules
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{inputs.artifact_name}}
        path: ${{runner.temp}}/download-npm-package-action/${{inputs.artifact_name}}
        retention-days: 1
