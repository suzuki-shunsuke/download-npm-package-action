---
permissions: {}
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
jobs:
  test:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.64.0
    permissions:
      pull-requests: read
      contents: read

  npm:
    uses: $/.github/workflows/download.yaml
    permissions:
      contents: read
      id-token: write
    with:
      working_directory: testdata
      ref: ${{github.event.pull_request.head.sha}}
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  restore:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    needs: npm
    permissions:
      contents: read
    steps:
      - name: Checkout the commit where npm packages were installed
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{needs.npm.outputs.sha}}
          persist-credentials: false

      - name: Check the output sha
        env:
          SHA: ${{needs.npm.outputs.sha}}
          HEAD_SHA: ${{github.event.pull_request.head.sha}}
        run: test "$SHA" = "$HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Restore node_modules
        uses: $/restore
        with:
          working_directory: testdata

      - name: Use the restored package
        working-directory: testdata
        run: node -e 'console.log(require("semver").valid("1.2.3"))'

      # Symlinks in node_modules/.bin are kept
      - name: Run the command of the restored package
        working-directory: testdata
        run: npx --no-install semver 1.2.3

      # The restore action sets NPM_CONFIG_OFFLINE=true, so packages that aren't restored can't be downloaded
      - name: Check npm can't download packages from the registry
        working-directory: testdata
        run: |
          test "$NPM_CONFIG_OFFLINE" = true
          if npx --yes cowsay@1.6.0 hi; then
            echo "::error::npx should fail because NPM_CONFIG_OFFLINE=true"
            exit 1
          fi

  # Install npm packages of another repository with the input repository
  npm-external:
    uses: $/.github/workflows/download.yaml
    permissions:
      contents: read
      id-token: write
    with:
      repository: suzuki-shunsuke/tfcmt
      ref: 671a0a34185aac930fa29bbda285b24e6d2610f9
      working_directory: website
      node-version-file: website/.node-version
      artifact_name: node_modules-external
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  restore-external:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    needs: npm-external
    permissions:
      contents: read
    steps:
      - name: Check the output sha
        env:
          SHA: ${{needs.npm-external.outputs.sha}}
        run: test "$SHA" = 671a0a34185aac930fa29bbda285b24e6d2610f9

      - name: Checkout the commit where npm packages were installed
        uses: actions/checkout@v7.0.1
        with:
          repository: suzuki-shunsuke/tfcmt
          ref: ${{needs.npm-external.outputs.sha}}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: website/.node-version

      - name: Restore node_modules
        uses: $/restore
        with:
          working_directory: website
          artifact_name: node_modules-external

      - name: Run the command of the restored package
        working-directory: website
        run: npx --no-install docusaurus --version
