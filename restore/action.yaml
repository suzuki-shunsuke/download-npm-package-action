name: restore
description: Restore node_modules from GitHub artifacts
inputs:
  working_directory:
    description: The directory where node_modules is extracted
    required: false
    default: "."
  artifact_name:
    description: GitHub artifact name
    required: false
    default: node_modules
runs:
  using: composite
  steps:
    - name: Download node_modules
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{inputs.artifact_name}}
        path: ${{runner.temp}}/download-npm-package-action-restore/${{inputs.artifact_name}}

    - name: Extract node_modules
      shell: bash
      working-directory: ${{inputs.working_directory}}
      env:
        ARTIFACT_NAME: ${{inputs.artifact_name}}
      run: tar -xf "$RUNNER_TEMP/download-npm-package-action-restore/$ARTIFACT_NAME/node_modules.tar"
